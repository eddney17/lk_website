<div class="carousel">
  <button class="carousel-btn prev" type="button" (click)="prev()" aria-label="Previous image">&#10094;</button>
  <div class="carousel-track" [style.transform]="trackTransform" [style.transition]="transition" (transitionend)="onTransitionEnd()">
    <img *ngFor="let slide of displaySlides" [src]="slide.src" [alt]="slide.alt" />
  </div>
  <button class="carousel-btn next" type="button" (click)="next()" aria-label="Next image">&#10095;</button>
</div>
